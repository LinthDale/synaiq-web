                <a href="#" class="btn btn-gold" style="border-bottom:1px solid #CCA858">看 KIP 平台</a>
              </div>

          <div class="row3">
            <div style="background:#DBDAD4;padding:72px 72px 72px 96px;border-top:1px solid rgba(25,27,30,.16)">

              <h2 class="k-h2" style="margin-bottom:34px">問得到、答得準、接得上。</h2>
              <div style="display:flex;flex-direction:column">
                <div style="display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;padding:18px 0;border-top:1px solid rgba(25,27,30,.3)"><div class="k-h4">準確回答，低 AI 幻覺</div><div class="k-body" style="max-width:none">有依據才回答。查不到就說查不到。</div></div>
                <div style="display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;padding:18px 0;border-top:1px solid rgba(25,27,30,.16)"><div class="k-h4">快速找到需要的資訊</div><div class="k-body" style="max-width:none">上萬份文件秒級定位。不必先知道在哪一份。</div></div>
                <div style="display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;padding:18px 0;border-top:1px solid rgba(25,27,30,.16)"><div class="k-h4">自然語言提問</div><div class="k-body" style="max-width:none">不必想關鍵字。整句話直接問。</div></div>

                <div style="display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;padding:18px 0;border-top:1px solid rgba(25,27,30,.16)"><div class="k-h4">多知識來源整合</div><div class="k-body" style="max-width:none">跨部門跨系統的文件。一次查得到。</div></div>
                <div style="display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;padding:18px 0 18px 12px;border-top:1px solid rgba(25,27,30,.16);border-left:2px solid #8A6A17;background:rgba(204,168,88,.14)"><div class="k-h4">資訊來源驗證</div><div class="k-body" style="max-width:none;color:#191B1E">每句都指得到。原文哪一份、哪一頁。</div></div>
                <div style="display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;padding:18px 0;border-top:1px solid rgba(25,27,30,.16)"><div class="k-h4">多輪對話能力</div><div class="k-body" style="max-width:none">可以接著追問。不必每次從頭講。</div></div>
