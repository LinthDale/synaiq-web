<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" class="screen-library" role="img" aria-labelledby="title desc">
<title id="title">{{title}}</title><desc id="desc">{{description}}</desc>
{{chrome}}
<g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" fill="#282825">
<text x="292" y="161" font-size="35">{{heading}}</text><text x="292" y="211" font-size="19" fill="#64645e">{{intro}}</text>
<rect x="291" y="274" width="760" height="56" rx="9" fill="#fff" stroke="#c8c8c0"/><text x="315" y="310" font-size="17" fill="#64645e">{{searchPlaceholder}}</text><rect x="1171" y="274" width="176" height="56" rx="9" fill="#282825"/><text x="1204" y="310" font-size="17" fill="#f4f4f2">{{addDocument}}</text>
<rect x="291" y="376" width="1056" height="60" fill="#e9e9e3"/><text x="317" y="413" font-size="16">{{columnName}}</text><text x="892" y="413" font-size="16">{{columnFormat}}</text><text x="1080" y="413" font-size="16">{{columnStatus}}</text>
<g font-size="21"><text x="317" y="492">{{contractFilename}}</text><text x="317" y="587">{{workflowFilename}}</text><text x="317" y="682">{{indexFilename}}</text></g>
<g font-size="17" fill="#64645e"><text x="892" y="492">{{pdfFormat}}</text><text x="892" y="587">{{wordFormat}}</text><text x="892" y="682">{{excelFormat}}</text><text x="1080" y="492">{{contractStatus}}</text><text x="1080" y="587">{{workflowStatus}}</text><text x="1080" y="682">{{indexStatus}}</text></g>
<path d="M291 533H1347M291 628H1347M291 723H1347" stroke="#cecec6"/>
<text x="291" y="793" font-size="15" fill="#64645e">{{disclaimer}}</text>
<text x="552" y="854" font-size="14" fill="#64645e">{{footer}}</text>
</g></svg>
