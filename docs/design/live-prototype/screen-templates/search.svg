<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" class="screen-search" role="img" aria-labelledby="title desc">
<title id="title">{{title}}</title><desc id="desc">{{description}}</desc>
{{chrome}}
<g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" fill="#282825">
<text x="296" y="148" font-size="14" fill="#64645e">{{breadcrumb}}</text>
<rect x="540" y="190" width="814" height="78" rx="12" fill="#dfe5d9"/>
<text x="569" y="239" font-size="24">{{question}}</text>
<rect x="287" y="328" width="44" height="44" rx="6" fill="#282825"/><text x="297" y="359" font-size="23" fill="#f4f4f2">{{avatar}}</text>
<text x="360" y="359" font-size="25">{{answerHeading}}</text>
<text x="360" y="412" font-size="24">{{answerClause}}</text>
<path d="M358 430Q837 439 1314 429" fill="none" stroke="#637859" stroke-width="2"/>
<text x="360" y="477" font-size="17" fill="#64645e">{{answerNote}}</text>
<rect x="360" y="523" width="994" height="142" rx="8" fill="#e3e9dc" stroke="#819b70"/>
<text x="386" y="562" font-size="14" fill="#64645e">{{sourceLabel}}</text>
<text x="386" y="602" font-size="22">{{sourceFilename}}</text><text x="1326" y="602" text-anchor="end" font-size="17">{{sourcePage}}</text>
<text x="386" y="641" font-size="16" fill="#64645e">{{sourceDisclaimer}}</text>
<rect x="286" y="746" width="1071" height="81" rx="12" fill="#fff" stroke="#b7b7af"/>
<text x="316" y="795" font-size="20" fill="#64645e">{{followup}}</text>
<rect x="1230" y="762" width="106" height="49" rx="6" fill="#282825"/>
<text x="1244" y="793" font-size="17" fill="#f4f4f2">{{send}}</text>
<svg id="send-pen" x="1300" y="773" width="24" height="27" viewBox="4.5 3 18 20" overflow="hidden" style="mix-blend-mode:screen"><image width="26" height="26" href="{{art.pen}}" filter="url(#pen-light)"/></svg>
<text x="800" y="864" text-anchor="middle" font-size="14" fill="#64645e">{{footer}}</text>
</g></svg>
