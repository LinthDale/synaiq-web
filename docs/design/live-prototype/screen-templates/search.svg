<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">{{title}}</title><desc id="desc">{{description}}</desc>
<rect width="1440" height="900" rx="20" fill="#f8f8f7"/>
<path d="M0 68H1440M230 68V900" stroke="#d5d5ce"/>
<path d="M0 68H230V900H0Z" fill="#ecece8"/>
<g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" fill="#282825">
<image x="32" y="20" width="166" height="28" href="{{brand.logoDataUrl}}"/><text x="266" y="42" font-size="16">{{appTitle}}</text><text x="1150" y="42" font-size="14" fill="#64645e">{{sampleBadge}}</text>
<rect x="22" y="102" width="186" height="48" rx="8" fill="#282825"/><text x="59" y="133" font-size="17" fill="#f4f4f2">{{newChat}}</text>
<text x="28" y="213" font-size="13" fill="#64645e">{{recentQuestions}}</text><rect x="18" y="234" width="194" height="50" rx="6" fill="#dcdcd5"/>
<text x="30" y="266" font-size="16">{{warrantyQuestion}}</text><text x="30" y="327" font-size="16">{{processingQuestion}}</text><text x="30" y="388" font-size="16">{{sourcesQuestion}}</text>
<text x="30" y="842" font-size="14" fill="#64645e">{{workspace}}</text>
<text x="296" y="141" font-size="14" fill="#64645e">{{breadcrumb}}</text>
<rect x="652" y="184" width="706" height="74" rx="14" fill="#e7e7e1"/>
<text x="680" y="229" font-size="23">{{question}}</text>
<rect x="287" y="319" width="44" height="44" rx="10" fill="#282825"/><text x="297" y="349" font-size="23" fill="#f4f4f2">{{avatar}}</text>
<text x="360" y="350" font-size="25">{{answerHeading}}</text>
<text x="360" y="401" font-size="25">{{answerClause}}</text>
<path d="M355 421Q645 436 1010 419" fill="none" stroke="#529a6a" stroke-width="3"/>
<text x="360" y="465" font-size="17" fill="#64645e">{{answerNote}}</text>
<rect x="360" y="509" width="994" height="137" rx="10" fill="#fff" stroke="#c8c8c0"/>
<text x="386" y="545" font-size="14" fill="#64645e">{{sourceLabel}}</text><text x="386" y="582" font-size="22">{{sourceFilename}}</text><text x="1206" y="583" font-size="19">{{sourcePage}}</text>
<text x="386" y="620" font-size="16" fill="#64645e">{{sourceDisclaimer}}</text>
<rect x="286" y="733" width="1071" height="85" rx="14" fill="#fff" stroke="#b7b7af"/>
<text x="316" y="783" font-size="20" fill="#64645e">{{followup}}</text><rect x="1274" y="752" width="61" height="48" rx="9" fill="#282825"/><text x="1290" y="783" font-size="17" fill="#f4f4f2">{{send}}</text>
<text x="552" y="854" font-size="14" fill="#64645e">{{footer}}</text>
</g></svg>
