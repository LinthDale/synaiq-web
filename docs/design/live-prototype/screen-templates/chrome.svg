<!-- Shared static interface chrome. Paper/ink/gold/green match the animated film. -->
<defs>
  <clipPath id="screen-clip"><rect width="1440" height="900" rx="20"/></clipPath>
  <filter id="paper-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".64 .17" numOctaves="3" seed="14" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <linearGradient id="side-light"><stop stop-color="#fffdf3" stop-opacity=".6"/><stop offset=".85" stop-color="#fffdf3" stop-opacity="0"/><stop offset="1" stop-color="#91846b" stop-opacity=".13"/></linearGradient>
  <mask id="header-tear" maskUnits="userSpaceOnUse" x="0" y="0" width="1440" height="24" style="mask-type:alpha"><image x="-86" y="-15" width="1613" height="160" preserveAspectRatio="none" href="{{art.edge}}"/></mask>
  <filter id="paper-shadow" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="1" flood-color="#252520" flood-opacity=".15"/></filter>
  <filter id="pen-light"><feComponentTransfer><feFuncR type="linear" slope="3"/><feFuncG type="linear" slope="3"/><feFuncB type="linear" slope="3"/></feComponentTransfer></filter>
</defs>
<style>.screen-library .nav-selection { transform:translateY(66px); }</style>
<g clip-path="url(#screen-clip)">
  <rect width="1440" height="900" fill="#f8f8f7"/>
  <rect x="0" y="68" width="230" height="832" fill="#e9e6dc"/>
  <rect x="0" y="68" width="230" height="832" fill="url(#side-light)"/>
  <rect x="0" y="68" width="230" height="832" filter="url(#paper-grain)" opacity=".136" style="mix-blend-mode:multiply"/>
  <path d="M229 70V900M232 70V900" stroke="#b8af9b" stroke-opacity=".4"/>
  <path d="M231 70V900" stroke="#f3f0e7"/>
  <g id="paper-header" filter="url(#paper-shadow)">
    <rect width="1440" height="69" fill="#f8f8f7"/>
    <svg y="68" width="1440" height="24" viewBox="0 0 1440 24"><g transform="translate(0 24) scale(1 -1)"><rect width="1440" height="24" fill="#f8f8f7" mask="url(#header-tear)"/></g></svg>
  </g>
  <image x="32" y="20" width="166" height="28" href="{{brand.logoDataUrl}}"/>
  <image id="product-logo" x="{{layout.productLogoX}}" y="22.69" width="139.35" height="23.62" href="{{product.logoDataUrl}}"/>
  <text x="1412.13" y="34.5" text-anchor="end" dominant-baseline="central" font-family="Manrope,Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="13.94" letter-spacing=".557" fill="#282825" textLength="{{layout.productLabelWidth}}" lengthAdjust="spacingAndGlyphs">{{productLabel}}</text>
  <g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" fill="#282825">
    <rect x="18" y="111" width="194" height="50" rx="6" fill="#282825"/>
    <text x="30" y="142" font-size="16" fill="#f4f4f2">{{newChat}}</text>
    <text x="28" y="222" font-size="13" fill="#64645e">{{recentQuestions}}</text>
    <g class="nav-selection"><rect x="18" y="244" width="194" height="50" rx="2" fill="#fffdf3" fill-opacity=".62"/><path d="M18 244V294" stroke="#cca858" stroke-width="2"/></g>
    <text x="30" y="276" font-size="14">{{conversationTopic}}</text>
    <text x="30" y="342" font-size="14">{{knowledgeCenter}}</text>
    <text x="30" y="408" font-size="14">{{sourcesQuestion}}</text>
    <svg id="sidebar-dialogues" x="20" y="708" width="116" height="91" viewBox="35 48 104 82" overflow="hidden" opacity=".9" style="mix-blend-mode:multiply"><image width="173" height="173" href="{{art.dialogues}}"/></svg>
    <text x="30" y="851" font-size="14" fill="#64645e">{{workspace}}</text>
  </g>
</g>
