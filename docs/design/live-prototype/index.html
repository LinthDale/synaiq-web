<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SynaiQ · Live design</title>
<style>
*{box-sizing:border-box}body{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;overflow:hidden;margin:0;background:#dededb;color:#282825;font:14px/1.5 system-ui,sans-serif}header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;background:#f4f4f2;border-bottom:1px solid #c3c3be}strong{margin-right:auto}button,select,input{font:inherit}button,select{min-height:38px;border:1px solid #b4b4ad;border-radius:6px;background:transparent;padding:6px 12px;color:inherit}label{display:flex;align-items:center;gap:8px}input{width:140px}output{min-width:58px;font-variant-numeric:tabular-nums}.stage{padding:16px;overflow:clip;min-height:0;min-width:0;width:100%}.viewport{margin:auto;transform-origin:top left}iframe{display:block;border:0;width:100%;height:900px;background:#f4f4f2;box-shadow:0 8px 30px #00000010}.status{padding:0 20px 12px;color:#555;font-size:12px}a{color:inherit}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #282825;outline-offset:3px}
</style></head><body>
<header><strong data-preview-label="title">SynaiQ / 設計原型</strong><label><span data-preview-label="page">頁面</span><select id="page"><option value="home">首頁</option><option value="kip">KIP 平台</option><option value="cases">實績展示</option><option value="about">關於我們</option></select></label><label><span data-preview-label="language">語言</span><select id="language"><option value="zh-Hant">繁體中文</option><option value="en">English</option></select></label><label><span data-preview-label="width">寬度</span><input id="width" type="range" min="320" max="1600" value="1440"><output id="readout">1440 px</output></label><button type="button" id="fit" data-preview-label="fit">配合視窗</button><a id="direct" href="page.html?page=home" target="_blank" rel="noopener" data-preview-label="direct">獨立開啟</a></header>
<div class="stage" id="stage"><div class="viewport" id="viewport"><iframe id="preview" title="SynaiQ 可連續縮放設計原型"></iframe></div></div>
<div class="status" id="status" aria-live="polite"></div>
<div class="status" id="metrics" aria-live="polite"></div>
<script type="module" src="preview.js"></script></body></html>
