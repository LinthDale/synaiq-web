name: Website CI and Hostinger deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'docs/design/live-prototype/**'
      - 'public/brand/**'
      - 'scripts/hostinger/**'
      - '.github/workflows/hostinger.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt an upload, route switch, backup or deletion. New pending work supersedes
# older pending runs; the active deployment completes before the next one starts.
concurrency:
  group: hostinger-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run test:deploy
      - run: npm run test:design
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Package and browser-check the production payload
        env:
          DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node scripts/hostinger/cli.mjs package "$DEPLOY_ID"
          node scripts/hostinger/cli.mjs local "$DEPLOY_ID"

  deploy:
    needs: test
    if: github.repository == 'LinthDale/synaiq-web' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.HOSTINGER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://taistro.com.tw/
    permissions:
      contents: write # Encrypted backups in draft Releases; no commits are made by CI.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Skip a superseded commit before touching production
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          # A documentation-only push must not suppress a pending website update.
          # Compare complete Git trees, avoiding the API's changed-file truncation.
          if [ "$current" != "$GITHUB_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$current"
          fi
          if git diff --quiet "$GITHUB_SHA" "$current" -- docs/design/live-prototype public/brand scripts/hostinger .github/workflows/hostinger.yml package.json package-lock.json; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [ "$result" -ne 1 ]; then exit "$result"; fi
            echo "Deployment inputs superseded by a newer main commit; skipping."
          fi
      - name: Package and check immutable deployment inputs
        if: steps.head.outputs.current == 'true'
        env:
          DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node scripts/hostinger/cli.mjs package "$DEPLOY_ID"
          node scripts/hostinger/cli.mjs local "$DEPLOY_ID"
      - name: Stage, verify, activate, back up and prune
        if: steps.head.outputs.current == 'true'
        env:
          DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_BACKUP_KEY: ${{ secrets.HOSTINGER_BACKUP_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/hostinger/cli.mjs deploy "$DEPLOY_ID"
      - name: Encrypt failure evidence
        if: failure() && steps.head.outputs.current == 'true'
        env:
          DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          HOSTINGER_BACKUP_KEY: ${{ secrets.HOSTINGER_BACKUP_KEY }}
        run: node scripts/hostinger/cli.mjs seal-failure "$DEPLOY_ID"
      - name: Store only encrypted evidence
        if: always() && steps.head.outputs.current == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hostinger-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/hostinger-ci/${{ github.run_id }}-${{ github.run_attempt }}/backup.tar.gz.enc
            out/hostinger-ci/${{ github.run_id }}-${{ github.run_attempt }}/evidence.tar.gz.enc
            out/hostinger-ci/${{ github.run_id }}-${{ github.run_attempt }}/failure-evidence.tar.gz.enc
          if-no-files-found: ignore
          retention-days: 90
